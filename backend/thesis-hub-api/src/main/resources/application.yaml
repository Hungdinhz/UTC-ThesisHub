spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ${APP_NAME:thesis-hub-api}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      keepalive-time: 15000
      max-lifetime: 300000
      idle-timeout: 60000
      connection-timeout: 20000
      minimum-idle: 3
      maximum-pool-size: 10
      leak-detection-threshold: 30000

  data:
    web:
      pageable:
        page-serialization-mode: direct

  flyway:
    enabled: true
    out-of-order: true
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing,*:future,*:ignored"

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 30
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_FILE_SIZE:20MB}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  docker:
    compose:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.ai.model.chat.memory.repository.redis.autoconfigure.RedisChatMemoryRepositoryAutoConfiguration
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration

server:
  port: ${APP_PORT:8080}

app:
  frontend-url: ${APP_FRONTEND_URL:https://utc-thesishub.vercel.app}
  backend-url: ${APP_BACKEND_URL:https://utc-thesishub.onrender.com}

  jwt:
    secret: ${JWT_SECRET:THESISHUB_SECRET_KEY_FOR_JWT_SIGNING_NEED_TO_BE_AT_LEAST_256_BITS_LONG_UTC_2026!}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  file:
    storage-path: ${FILE_STORAGE_PATH:./uploads}
    max-db-bytes: ${FILE_MAX_DB_BYTES:10485760}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://utc-thesishub.vercel.app,https://utc-thesishub.onrender.com,https://utc-thesishub-develop.onrender.com,http://localhost:3000,http://localhost:5173}

  admin:
    registration-key: ${ADMIN_REGISTRATION_KEY:}
    require-key-on-login: ${ADMIN_LOGIN_REQUIRE_KEY:false}
